<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockPro · Panel propietario</title><style>
:root{color-scheme:dark;--bg:#071b17;--card:#102c25;--lime:#b8ff55;--muted:#9bb7ad}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061510,#102c25);font:15px system-ui;color:#effff7;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:24px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{background:var(--lime);color:#10251b;border-radius:14px;padding:12px;font-weight:900}.brand h1{margin:0}.muted{color:var(--muted)}.card{background:#0d2922;border:1px solid #24483c;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 14px 40px #0003}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #31594a;background:#061d17;color:white;width:100%;margin:5px 0}button{background:var(--lime);color:#142719;font-weight:800;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.pill{padding:5px 9px;background:#214b3c;border-radius:99px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#d2ffac}#out{max-height:380px;overflow:auto}@media(max-width:560px){.wrap{padding:14px}.row{display:block}}</style></head><body><main class="wrap"><div class="brand"><div class="logo">SP</div><div><h1>StockPro <span style="color:var(--lime)">Owner</span></h1><div class="muted">Panel privado de licencias</div></div></div><section class="card"><h2>Conexión segura</h2><p class="muted">Introduce la URL de tu servidor HTTPS y el token de propietario. No compartas el token.</p><input id="url" placeholder="https://api.tudominio.com"><input id="token" type="password" placeholder="Token privado de propietario"><button onclick="loadLicenses()">Conectar y cargar licencias</button></section><section class="card"><h2>Emitir licencia</h2><div class="grid"><label>Cliente<input id="customer" placeholder="Nombre del negocio"></label><label>ID del dispositivo<input id="device" placeholder="Identificador generado por la app"></label><label>Plan<select id="plan"><option>30 días</option><option>90 días</option><option>180 días</option><option>365 días</option><option>Personalizado</option></select></label><label>Días<input id="days" type="number" min="1" max="3650" value="30"></label></div><button onclick="issue()">Crear licencia</button></section><section class="card"><div class="row"><div><h2>Licencias registradas</h2><span class="muted">Crear, renovar o revocar</span></div><button onclick="loadLicenses()">Actualizar</button></div><div id="out" class="muted">Conecta con el servidor para ver los datos.</div></section><section class="card"><h3>Registro de actividad</h3><button onclick="audit()">Ver auditoría</button><pre id="auditout"></pre></section></main><script>
const $=id=>document.getElementById(id);function base(){return $('url').value.replace(/\/$/,'')}function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+$('token').value}}async function api(path,opts={}){const r=await fetch(base()+path,{...opts,headers:{...headers(),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('Error HTTP '+r.status));return d}async function loadLicenses(){try{const d=await api('/v1/owner/licenses');$('out').innerHTML=d.licenses.map(x=>`<div class="card"><div class="row"><b>${esc(x.customer)}</b><span class="pill">${esc(x.status)}</span></div><p>${esc(x.id)} · ${esc(x.plan)}</p><p class="muted">Vence: ${esc(x.expires_at)}</p><div class="row"><button onclick="renew('${x.id}')">Renovar 30 días</button><button onclick="revoke('${x.id}')">Revocar</button></div></div>`).join('')||'No hay licencias todavía.'}catch(e){$('out').textContent=e.message}}async function issue(){try{const days=+$('days').value;const d=await api('/v1/owner/licenses',{method:'POST',body:JSON.stringify({customer:$('customer').value,device_id:$('device').value,days,plan:$('plan').value})});alert('Licencia creada: '+d.id);await loadLicenses()}catch(e){alert(e.message)}}async function renew(id){try{await api('/v1/owner/licenses/'+id+'/renew',{method:'POST',body:JSON.stringify({days:30})});await loadLicenses()}catch(e){alert(e.message)}}async function revoke(id){if(!confirm('¿Revocar esta licencia?'))return;try{await api('/v1/owner/licenses/'+id+'/revoke',{method:'POST'});await loadLicenses()}catch(e){alert(e.message)}}async function audit(){try{$('auditout').textContent=JSON.stringify(await api('/v1/owner/audit'),null,2)}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
