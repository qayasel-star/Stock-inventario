services:
  stockpro-api:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      STOCKPRO_DB: /var/lib/stockpro/stockpro.db
    volumes:
      - stockpro_data:/var/lib/stockpro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  stockpro_data:
